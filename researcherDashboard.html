<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Researcher Dashboard</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #f4f6fb; color: #1f2937; }
    .page { max-width: 1400px; margin: 0 auto; padding: 24px; }
    .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 14px; padding: 18px 20px; margin-bottom: 18px; box-shadow: 0 8px 18px rgba(15,23,42,.06); }
    .muted { color: #6b7280; font-size: 12px; line-height: 1.5; }
    .summary-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:12px; }
    .stat { background:#f9fafb; border:1px solid #e5e7eb; border-radius:12px; padding:12px 14px; }
    .stat-label { display:block; font-size:11px; color:#6b7280; text-transform:uppercase; margin-bottom:8px; }
    .stat-value { font-size:28px; font-weight:700; }
    .table-wrap { overflow-x:auto; border:1px solid #e5e7eb; border-radius:10px; }
    table { width:100%; border-collapse:collapse; font-size:13px; }
    th,td { padding:10px 12px; border-bottom:1px solid #e5e7eb; text-align:left; vertical-align:top; }
    th { background:#f9fafb; color:#6b7280; font-size:11px; text-transform:uppercase; }
    .pill { display:inline-block; border-radius:999px; padding:4px 9px; font-size:11px; font-weight:700; }
    .yes { background:#bbf7d0; color:#166534; }.no { background:#dbeafe; color:#1d4ed8; }.danger { background:#fecaca; color:#991b1b; }
    button { border:1px solid #e5e7eb; background:white; border-radius:8px; padding:9px 12px; cursor:pointer; }
    .analysis-layout { display:grid; grid-template-columns:1.3fr .9fr; gap:18px; }.panel { background:#f9fafb; border:1px solid #e5e7eb; border-radius:12px; padding:16px; }
    .turn { border:1px solid #e5e7eb; border-radius:10px; background:white; padding:12px; margin-bottom:10px; }.turn.customer { border-left:4px solid #a5b4fc; }.turn.agent { border-left:4px solid #d1d5db; }
    .mini-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:8px; }.mini { background:#fff; border:1px solid #e5e7eb; border-radius:8px; padding:8px 9px; font-size:12px; }.mini strong { display:block; color:#6b7280; font-size:10px; text-transform:uppercase; margin-bottom:4px; }
    @media(max-width:900px){.analysis-layout{grid-template-columns:1fr}}
  </style>
</head>
<body><div class="page"><div class="card"><div style="display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap"><div><h1 style="margin-bottom:6px">Researcher Dashboard</h1><p class="muted">Combined results and analysis for the fixed 25-conversation study.</p></div><button id="refreshButton">Refresh</button></div><div id="storageWarning" class="muted" style="margin:12px 0"></div><div id="summaryGrid" class="summary-grid"></div></div><div class="card"><h2>25-Conversation Comparison</h2><div id="conversationTableWrap" class="table-wrap"></div></div><div class="card"><h2>Expanded Conversation Analysis</h2><div id="analysisDetail"></div></div></div>
<script src="dataSubmission.js"></script><script>
const state={responses:[],ai:[],conversations:[],selected:null};const esc=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');async function fetchJson(path){try{const r=await fetch(path,{cache:'no-store'});return r.ok?await r.json():[];}catch(e){return[];}}function roleResponses(role){return state.responses.filter(x=>String(x.role||'').toLowerCase()===role);}function summary(role,id){const a=roleResponses(role).filter(x=>String(x.conversationId)===String(id));const yes=a.filter(x=>x.handoffDecision===true).length;return{total:a.length,yes,no:a.length-yes,rate:a.length?Math.round(yes/a.length*100):0};}function renderSummary(){const g=roleResponses('general'),p=roleResponses('professional');const gp=new Set(g.map(x=>x.participantId)).size,pp=new Set(p.map(x=>x.participantId)).size;document.getElementById('summaryGrid').innerHTML=`<div class="stat"><span class="stat-label">General participants</span><div class="stat-value">${gp}</div></div><div class="stat"><span class="stat-label">Professional reviewers</span><div class="stat-value">${pp}</div></div><div class="stat"><span class="stat-label">Participant judgments</span><div class="stat-value">${g.length}</div></div><div class="stat"><span class="stat-label">Professional judgments</span><div class="stat-value">${p.length}</div></div>`;}function renderTable(){const rows=state.conversations.map((c,i)=>{const g=summary('general',c.conversationId),p=summary('professional',c.conversationId),ai=state.ai.find(x=>String(x.conversationId)===String(c.conversationId));return `<tr data-id="${esc(c.conversationId)}" style="cursor:pointer"><td>${i+1}</td><td>${esc(c.issueType||'')}</td><td>${g.yes}/${g.total} (${g.rate}%)</td><td>${p.yes}/${p.total} (${p.rate}%)</td><td>${ai?(ai.aiHandoffDecision?'<span class="pill danger">Escalate</span>':'<span class="pill no">No escalation</span>'):'—'}</td><td>${ai?.escalationTurn??'—'}</td></tr>`}).join('');document.getElementById('conversationTableWrap').innerHTML=`<table><thead><tr><th>#</th><th>Issue</th><th>Participants</th><th>Professional</th><th>AI</th><th>Escalation turn</th></tr></thead><tbody>${rows}</tbody></table>`;document.querySelectorAll('tr[data-id]').forEach(r=>r.onclick=()=>{state.selected=r.dataset.id;renderDetail();});}function renderDetail(){const id=state.selected||String(state.conversations[0]?.conversationId||'');const c=state.conversations.find(x=>String(x.conversationId)===id);const ai=state.ai.find(x=>String(x.conversationId)===id);if(!c){document.getElementById('analysisDetail').innerHTML='<p class="muted">No conversation selected.</p>';return;}const turns=(c.turns||[]).map(t=>{const a=(ai?.customerTurnAnalysis||[]).find(x=>Number(x.turnNumber)===Number(t.turnNumber));return `<div class="turn ${t.role==='customer'?'customer':'agent'}"><strong>${t.role==='customer'?'Customer':'Agent'}${t.turnNumber?' turn '+t.turnNumber:''}</strong><div style="margin-top:6px">${esc(t.text||'')}</div>${a?`<div class="mini-grid" style="margin-top:10px"><div class="mini"><strong>Sentiment</strong>${esc(a.sentimentLabel||'—')}</div><div class="mini"><strong>Sentiment score</strong>${Number(a.sentimentScore||0).toFixed(4)}</div><div class="mini"><strong>Negative intensity</strong>${Number(a.mappedEmotionScores?.negativeIntensity||0).toFixed(4)}</div><div class="mini"><strong>Frustration</strong>${Number(a.mappedEmotionScores?.frustration||0).toFixed(4)}</div><div class="mini"><strong>Anger</strong>${Number(a.mappedEmotionScores?.anger||0).toFixed(4)}</div><div class="mini"><strong>Escalated</strong>${a.escalatedOnThisTurn?'Yes':'No'}</div></div>`:''}</div>`}).join('');document.getElementById('analysisDetail').innerHTML=`<div class="analysis-layout"><div class="panel"><h3>Conversation ${esc(id)}</h3>${turns}</div><div class="panel"><h3>AI summary</h3><div class="mini-grid"><div class="mini"><strong>Decision</strong>${ai?(ai.aiHandoffDecision?'Escalate':'No escalation'):'—'}</div><div class="mini"><strong>Escalation turn</strong>${ai?.escalationTurn??'—'}</div><div class="mini"><strong>Highest risk</strong>${ai?.highestEscalationRisk!==undefined?Number(ai.highestEscalationRisk).toFixed(4):'—'}</div></div></div></div>`;}async function initialize(){state.responses=await loadStoredCollection(RESPONSES_STORAGE_KEY,STUDY_SUBMISSION_CONFIG.responsesTable);state.ai=await fetchJson('research/ai_analysis_25.json');state.conversations=await fetchJson('research/study_conversations.json');state.selected=state.conversations.length?String(state.conversations[0].conversationId):null;document.getElementById('storageWarning').textContent=STUDY_SUBMISSION_CONFIG.supabaseUrl?'Using centralized study data.':'Preview mode: participant responses currently come from this browser\'s local study storage. AI analysis and all 25 conversations are available now.';renderSummary();renderTable();renderDetail();}document.getElementById('refreshButton').onclick=initialize;initialize();
</script></body></html>
